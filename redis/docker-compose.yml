services:
  redis:
    image: redis:8
    container_name: infra-redis

    restart: unless-stopped

    env_file:
      - .env

    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - ./data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - infra

networks:
  infra:
    external: true
    name: ${DOCKER_NETWORK}